# Panel redakcyjny: https://app.pagescms.org (logowanie kontem GitHub)
media:
  input: src/img/uploads
  output: /img/uploads
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: zapiski
    label: Zapiski z Kącików
    type: collection
    path: src/zapiski/wpisy
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, kategoria, szkic]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Tytuł
        type: string
        required: true
      - name: date
        label: Data
        type: date
        required: true
      - name: kategoria
        label: Kategoria
        type: select
        options:
          values: [Rozbudowa, Praktyka, Z życia Centrum]
      - name: opis
        label: Zajawka (1–2 zdania na liście wpisów)
        type: text
      - name: okladka
        label: Zdjęcie główne
        type: image
      - name: galeria
        label: Galeria zdjęć
        type: object
        list: true
        fields:
          - name: obraz
            label: Zdjęcie
            type: image
          - name: podpis
            label: Podpis
            type: string
      - name: szkic
        label: Szkic (nie publikuj jeszcze)
        type: boolean
        default: false
      - name: body
        label: Treść
        type: rich-text

  - name: strona
    label: Ustawienia strony
    type: file
    path: src/_data/strona.json
    format: json
    fields:
      - name: nazwa
        label: Nazwa
        type: string
      - name: haslo
        label: Hasło na górze strony
        type: string
      - name: wstep
        label: Wstęp pod hasłem
        type: text
      - name: email
        label: E-mail kontaktowy (opcjonalnie)
        type: string
      - name: adres
        label: Adres
        type: string
      - name: gmina
        label: Gmina, powiat, województwo
        type: string
      - name: kannonUrl
        label: Link do strony z numerami kont
        type: string
      - name: rozbudowa
        label: Etapy rozbudowy
        type: object
        list: true
        fields:
          - name: etap
            label: Etap
            type: string
          - name: opis
            label: Opis
            type: text
          - name: status
            label: Status
            type: select
            options:
              values: [zakończony, w toku, planowany]
